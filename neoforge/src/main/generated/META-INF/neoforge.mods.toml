license = "${mod_license}"
loaderVersion = "${neoforge_loader_version_range}"
modLoader = "javafml"
issueTrackerURL = "https://github.com/LIUKRAST/LightsOn"

[[accessTransformers]]
file = "src/main/resources/META-INF/accesstransformer.cfg"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mods]]
authors = "${mod_author}"
credits = "${mod_credits}"
description = "${mod_description}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
logoFile = "${mod_id}_banner.png"
modId = "${mod_id}"
version = "${version}"

[["dependencies.${mod_id}"]]
modId = "neoforge"
ordering = "NONE"
side = "BOTH"
type = "required"
versionRange = "[${neoforge_version},)"

[["dependencies.${mod_id}"]]
modId = "minecraft"
ordering = "NONE"
side = "BOTH"
type = "required"
versionRange = "${minecraft_version_range}"
